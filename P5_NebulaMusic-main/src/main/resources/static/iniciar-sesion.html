<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body>
<main class="auth-container">
    <section class="auth-card">
        <div class="form-logo">
            <img src="../static/imgs/nebula-03.svg" alt="Logo NebulaMusic">
        </div>
        <div class="form header">
            <h1 class="form-header">Iniciar sesión</h1>
            <p class="form-subtitle">Ingresa tus credenciales de acceso</p>
        </div>
        <form method="get" action="/authentication" enctype="application/x-www-form-urlencoded">
            <div class="form-group">
                <label for="correo">Correo electronico</label>
                <input type="email"
                       placeholder="correo@gmail.com"
                       id="correo"
                       name="correo"
                       required
                       minlength="5"
                       maxlength="100"
                >
            </div>
            <div class="form-group">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" required minlength="8" maxlength="20" autocomplete="off" placeholder="*****">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Iniciar sesión</button>
                <button type="reset" class="btn-secondary">Limpiar Formulario</button>
            </div>
        </form>
        <p>¿No tienes una cuenta? <a href="registro.html">Registrate aqui</a></p>
    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
