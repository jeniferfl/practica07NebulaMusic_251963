<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body>
<main class="auth-container">
    <section class="auth-card">
        <!-- TAREA PARA EL ALUMNO:
             Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
             Debe contener campos para:
             - Nombre completo (texto)
             - Correo electrónico (email)
             - Contraseña (password)
             - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
             - Género (radio buttons: Femenino, Masculino, Otro)
             - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
             - Fecha de nacimiento (date)
             - Aceptar términos y condiciones (checkbox)
             - Comentarios adicionales o gustos (textarea)
        -->
        <form class="auth-form" method="post" action="/crear-cuenta">
            <div id="form-header">
                <div class="form-logo">
                    <img src="../static/imgs/nebula-03.svg" alt="Nebula Music">
                </div>
                <h1 class="form-header">Crear cuenta</h1>
                <h4 class="form-subtitle">Completa los datos para registrarte</h4>
            </div>

            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" placeholder="ej. Carlos Rodriguez" id="nombre" name="nombre" required min="3" maxlength="100"><br>
            </div>

            <div>
                <label for="email">Correo electronico</label>
                <input type="email" id="email" name="email" required placeholder="tucorreo@gmail.com">
            </div>

            <div>
                <label for="contrasenia">Contraseña</label>
                <input type="password" required autocomplete="off" id="contrasenia" name="contrasenia" placeholder="*****"><br>
            </div>

            <div>
                <label for="alias">Alias</label>
                <input type="text" name="alias" id="alias" pattern="{[a-zA-z]{3,10}-[0-9]{2,10}}" required placeholder="Nebula-2026">
            </div>
            <div id="registro-genero">
                <label>Genero</label>
                <div>
                    <input type="radio" id="rad_femenino" name="genero" value="Femenino" required>
                    <label for="rad_femenino">Femenino</label>

                    <input type="radio" id="rad_masculino" name="genero" value="Masculino" required>
                    <label for="rad_masculino">Masculino</label>

                    <input type="radio" id="rad_otro" name="genero" value="Otro" required>
                    <label for="rad_otro">Otro</label>
                </div>
            </div>

            <div>
                <label for="suscripcion">Tipo de suscripción</label>
                <select name="suscripcion" id="suscripcion" required>
                    <option value="">-- Selecciona una opción --</option>
                    <option value="gratis">Gratis (Con anuncios)</option>
                    <option value="premium_mensual">Premium Mensual ($99/mes)</option>
                    <option value="premium_anual">Premium Mensual ($899/año)</option>
                </select>
            </div>

            <div>
                <label for="fechanacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechanacimiento" name="fechanacimiento" required>
            </div>

            <div>
                <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                <label for="terminos">Acepto los terminos y condiciones de uso</label>
            </div>

            <div id="comentarios">
                <label for="comentarios">Comentarios y preferencias</label>
                <textarea id="comentarios" name="comentarios" rows="4" columns="40" placeholder="Cuentanos que musica te gusta"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Registrarse</button>
                <button type="reset" class="btn-secondary">Limpiar campos</button>
            </div>

            <p>¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Inicia sesión aqui</a></p>

        </form>

    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
